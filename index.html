<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navalha City — Agendamento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app">

    <!-- STEP 0: HERO -->
    <div class="step active" id="step-0">
      <div class="hero">
        <div class="hero-bg"></div>
        <div class="hero-logo-wrap">
          <img class="hero-logo" src="/src/logo.jpg.jpeg" alt="Navalha City">
        </div>
        <div class="hero-badge">Est. 2019 &nbsp;·&nbsp; Excelência em cada corte</div>
        <h1 class="hero-title">Navalha<span>City</span></h1>
        <p class="hero-sub">Cinco unidades. Uma só qualidade.</p>
        <div class="hero-cta">
          <button class="btn-primary" id="btnAgendar">Agendar agora →</button>
        </div>
        <div class="scroll-hint">Cinco unidades disponíveis</div>
      </div>
    </div>

    <!-- STEP 1: UNIDADES -->
    <div class="step" id="step-1">
      <nav class="step-nav">
        <button class="btn-back" id="back1">← Início</button>
        <div class="step-dots">
          <div class="dot active"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
        <div class="nav-brand"><img class="nav-logo" src="/src/logo.jpg.jpeg" alt="Navalha City"> Navalha<span>City</span></div>
      </nav>
      <div class="step-content">
        <div class="section-label">Passo 01 — Onde você está?</div>
        <h2 class="section-title">Escolha<br>sua unidade</h2>
        <div id="filiaisList"></div>
      </div>
    </div>

    <!-- STEP 2: BARBEIROS -->
    <div class="step" id="step-2">
      <nav class="step-nav">
        <button class="btn-back" id="back2">← Unidades</button>
        <div class="step-dots">
          <div class="dot done"></div>
          <div class="dot active"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
        <div class="nav-brand"><img class="nav-logo" src="/src/logo.jpg.jpeg" alt="Navalha City"> Navalha<span>City</span></div>
      </nav>
      <div class="step-content" id="profileContent"></div>
    </div>

    <!-- STEP 3: AGENDAMENTO -->
    <div class="step" id="step-3">
      <nav class="step-nav">
        <button class="btn-back" id="back3">← Barbeiro</button>
        <div class="step-dots">
          <div class="dot done"></div>
          <div class="dot done"></div>
          <div class="dot active"></div>
          <div class="dot"></div>
        </div>
        <div class="nav-brand"><img class="nav-logo" src="/src/logo.jpg.jpeg" alt="Navalha City"> Navalha<span>City</span></div>
      </nav>
      <div class="step-content" id="scheduleContent"></div>
    </div>

    <!-- STEP 4: CONFIRMAÇÃO -->
    <div class="step" id="step-4">
      <div class="step-content center-content">
        <div class="confirm-screen">
          <div class="confirm-icon">✂️</div>
          <h2 class="confirm-title">Agendado!</h2>
          <div class="confirm-details" id="confirmDetails"></div>
          <button class="btn-primary" id="btnReset">Novo agendamento</button>
        </div>
      </div>
    </div>

  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
