<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Navalha City</title>
  <link rel="icon" type="image/jpeg" href="/src/logo.jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --black: #0a0a0a;
      --dark: #111111;
      --card: #161616;
      --border: #242424;
      --orange: #ffffff;
      --orange-dim: #cccccc;
      --white: #f0ece4;
      --muted: #888;
      --text: #ccc;
      --green: #2ecc71;
      --yellow: #f39c12;
      --red: #e74c3c;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { min-height: 100%; background: var(--black); color: var(--text); font-family: 'Barlow', sans-serif; }

    /* ── NAV ── */
    .dash-nav {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 32px;
      background: rgba(10,10,10,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }
    .dash-logo {
      font-family: 'Bebas Neue', sans-serif; font-size: 22px;
      color: var(--white); letter-spacing: 3px; text-decoration: none;
      flex-shrink: 0;
    }
    .dash-logo span { color: var(--orange); }

    .dash-nav-right {
      display: flex; align-items: center; gap: 12px;
      overflow: hidden;
    }
    .dash-role-badge {
      font-family: 'Barlow Condensed', sans-serif; font-size: 11px;
      letter-spacing: 2px; text-transform: uppercase;
      padding: 4px 10px; border-radius: 2px;
      border: 1px solid var(--border); color: var(--muted);
      flex-shrink: 0;
    }
    .dash-role-badge.admin   { border-color: var(--orange); color: var(--orange); }
    .dash-role-badge.gerente { border-color: var(--yellow); color: var(--yellow); }
    .dash-role-badge.barbeiro{ border-color: #aaa; color: #aaa; }

    .dash-user-name {
      font-family: 'Barlow Condensed', sans-serif; font-size: 14px;
      letter-spacing: 1px; color: var(--white);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .btn-logout {
      font-family: 'Barlow Condensed', sans-serif; font-size: 12px; letter-spacing: 2px;
      text-transform: uppercase; background: none; border: 1px solid var(--border);
      color: var(--muted); padding: 6px 14px; border-radius: 2px; cursor: pointer;
      transition: color .2s, border-color .2s; white-space: nowrap; flex-shrink: 0;
    }
    .btn-logout:hover { color: var(--red); border-color: var(--red); }

    .nav-links { display: flex; gap: 6px; }
    .nav-link {
      font-family: 'Barlow Condensed', sans-serif; font-size: 12px; letter-spacing: 2px;
      text-transform: uppercase; color: var(--muted); text-decoration: none;
      padding: 6px 14px; border-radius: 2px; border: 1px solid transparent;
      transition: color .2s, border-color .2s;
    }
    .nav-link:hover { color: var(--white); }
    .nav-link.active { color: var(--white); border-color: var(--border); }

    .btn-back-home {
      font-family: 'Barlow Condensed', sans-serif; font-size: 12px; letter-spacing: 2px;
      text-transform: uppercase; background: none; border: none;
      color: var(--muted); cursor: pointer; text-decoration: none;
      transition: color .2s; white-space: nowrap; flex-shrink: 0;
    }
    .btn-back-home:hover { color: var(--white); }

    /* ── MOBILE NAV: esconde elementos redundantes ── */
    @media (max-width: 600px) {
      .dash-nav { padding: 12px 16px; }
      .nav-links { display: none; }
      .dash-user-name { display: none; }
      .btn-logout { font-size: 11px; padding: 5px 10px; letter-spacing: 1px; }
      .dash-role-badge { font-size: 10px; padding: 3px 8px; letter-spacing: 1px; }
    }

    /* ── HAMBURGUER DO DASHBOARD ── */
    .dash-hamburger {
      display: none;
      flex-direction: column; justify-content: center; align-items: center; gap: 5px;
      width: 36px; height: 36px;
      background: none; border: 1px solid var(--border);
      cursor: pointer; padding: 0; flex-shrink: 0;
      transition: border-color .2s;
    }
    .dash-hamburger:hover { border-color: var(--orange-dim); }
    .dash-hamburger span {
      display: block; width: 16px; height: 1.5px;
      background: var(--muted); transition: background .2s, transform .3s, opacity .2s;
      transform-origin: center;
    }
    .dash-hamburger.open span     { background: var(--white); }
    .dash-hamburger.open span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
    .dash-hamburger.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
    .dash-hamburger.open span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

    .dash-mobile-menu {
      display: none;
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,.85); backdrop-filter: blur(16px);
      z-index: 200; flex-direction: column;
      padding-top: 64px;
    }
    .dash-mobile-menu.open { display: flex; }
    .dash-mobile-link {
      display: flex; align-items: center; gap: 14px;
      padding: 20px 28px; border-bottom: 1px solid var(--border);
      font-family: 'Barlow Condensed', sans-serif; font-size: 18px;
      font-weight: 600; letter-spacing: 3px; text-transform: uppercase;
      color: var(--muted); text-decoration: none;
      transition: color .2s;
    }
    .dash-mobile-link:hover, .dash-mobile-link.active { color: var(--white); }
    .dash-mobile-close {
      position: absolute; top: 16px; right: 18px;
      background: none; border: none; color: var(--muted);
      font-size: 22px; cursor: pointer; padding: 4px;
      transition: color .2s;
    }
    .dash-mobile-close:hover { color: var(--white); }
    .dash-mobile-user {
      padding: 20px 28px;
      font-family: 'Barlow Condensed', sans-serif; font-size: 13px;
      letter-spacing: 1px; color: var(--muted);
      margin-top: auto; border-top: 1px solid var(--border);
    }

    @media (max-width: 600px) {
      .dash-hamburger { display: flex; }
    }

    /* ── PAGE TRANSITION CURTAIN ── */
    #curtain {
      position: fixed; inset: 0; z-index: 9000; pointer-events: none; overflow: hidden;
    }
    #curtain.cover, #curtain.uncover { pointer-events: all; }
    .curtain-half {
      position: absolute; left: 0; right: 0; height: 51%;
      background: var(--black);
      will-change: transform;
      transition: transform 0.55s cubic-bezier(0.76, 0, 0.24, 1);
    }
    .curtain-top    { top: 0;    transform: translateY(-101%); }
    .curtain-bottom { bottom: 0; transform: translateY(101%);  }
    #curtain.cover .curtain-half { transform: translateY(0); }
    #curtain.uncover .curtain-top    { transform: translateY(-101%); }
    #curtain.uncover .curtain-bottom { transform: translateY(101%);  }
    .curtain-mark {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; z-index: 1; pointer-events: none; opacity: 0;
      transition: opacity 0.3s ease;
    }
    #curtain.cover .curtain-mark { opacity: 1; transition: opacity 0.35s ease 0.25s; }
    .curtain-mark-text {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(36px, 6vw, 64px);
      letter-spacing: 6px; color: var(--white); line-height: 1;
      transform: translateY(12px);
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .curtain-mark-text span { color: var(--white); opacity: 0.45; }
    .curtain-mark-line {
      display: block; width: 0; height: 1px;
      background: var(--white); opacity: 0.6;
      transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1) 0.15s;
    }
    #curtain.cover .curtain-mark-text { transform: translateY(0); }
    #curtain.cover .curtain-mark-line { width: 140px; }

    /* ── BLOQUEIO ── */
    #accessDenied {
      display: none; flex-direction: column; align-items: center; justify-content: center;
      min-height: 80vh; text-align: center; gap: 16px; padding: 24px;
    }
    #accessDenied .icon { font-size: 48px; }
    #accessDenied h2 { font-family: 'Bebas Neue', sans-serif; font-size: 36px; color: var(--white); letter-spacing: 3px; }
    #accessDenied p { color: var(--muted); font-size: 14px; }
    #loadingScreen {
      display: flex; align-items: center; justify-content: center; min-height: 80vh;
      font-family: 'Barlow Condensed', sans-serif; font-size: 13px; letter-spacing: 2px; color: var(--muted);
    }

    /* ── CONTEÚDO ── */
    #dashContent { display: none; padding: 32px; max-width: 1100px; margin: 0 auto; }

    .dash-header { margin-bottom: 24px; }
    .dash-title { font-family: 'Bebas Neue', sans-serif; font-size: 42px; color: var(--white); letter-spacing: 4px; line-height: 1; }
    .dash-subtitle { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; letter-spacing: 2px; color: var(--muted); margin-top: 6px; }

    /* badge de boas vindas no mobile (substitui o nome da nav) */
    .dash-welcome-mobile {
      display: none;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px; letter-spacing: 1px; color: var(--muted);
      margin-top: 4px;
    }
    @media (max-width: 600px) {
      .dash-welcome-mobile { display: block; }
    }

    /* ── FILTROS ── */
    .dash-filters {
      display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; align-items: center;
    }
    .filter-label {
      font-family: 'Barlow Condensed', sans-serif; font-size: 11px;
      letter-spacing: 2px; color: var(--muted); text-transform: uppercase;
    }
    .filter-select {
      background: var(--card); border: 1px solid var(--border); color: var(--text);
      font-family: 'Barlow Condensed', sans-serif; font-size: 13px; letter-spacing: 1px;
      padding: 8px 14px; border-radius: 2px; cursor: pointer; outline: none;
    }
    .filter-select:focus { border-color: var(--orange-dim); }

    /* ── STATS ── */
    .dash-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px; margin-bottom: 28px;
    }
    .stat-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 4px;
      padding: 18px 20px;
    }
    .stat-card .stat-n { font-family: 'Bebas Neue', sans-serif; font-size: 38px; color: var(--white); line-height: 1; }
    .stat-card .stat-l { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; letter-spacing: 2px; color: var(--muted); margin-top: 4px; text-transform: uppercase; }
    .stat-card.green .stat-n { color: var(--green); }
    .stat-card.yellow .stat-n { color: var(--yellow); }

    /* ── TABELA ── */
    .dash-table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
    .dash-table-header {
      padding: 14px 20px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .dash-table-title { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }
    .dash-count { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: var(--white); }

    table { width: 100%; border-collapse: collapse; }
    thead th {
      padding: 10px 16px; text-align: left;
      font-family: 'Barlow Condensed', sans-serif; font-size: 11px; letter-spacing: 2px;
      color: var(--muted); text-transform: uppercase; border-bottom: 1px solid var(--border);
    }
    tbody tr { border-bottom: 1px solid var(--border); transition: background .15s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(255,255,255,0.02); }
    tbody td {
      padding: 12px 16px;
      font-family: 'Barlow Condensed', sans-serif; font-size: 14px; letter-spacing: 0.5px;
      color: var(--text);
    }
    .td-name { color: var(--white); font-weight: 600; }
    .td-badge {
      display: inline-block; padding: 2px 8px; border-radius: 2px; font-size: 11px;
      letter-spacing: 1px; text-transform: uppercase;
    }
    .badge-confirmado { background: rgba(46,204,113,.12); color: var(--green); border: 1px solid rgba(46,204,113,.3); }
    .badge-pendente   { background: rgba(243,156,18,.12);  color: var(--yellow); border: 1px solid rgba(243,156,18,.3); }
    .badge-cancelado  { background: rgba(231,76,60,.12);   color: var(--red);    border: 1px solid rgba(231,76,60,.3); }
    .empty-row td { text-align: center; color: var(--muted); padding: 32px; }

    /* ── AÇÕES ── */
    .btn-action {
      font-family: 'Barlow Condensed', sans-serif; font-size: 11px; letter-spacing: 1.5px;
      text-transform: uppercase; padding: 4px 10px; border-radius: 2px; cursor: pointer;
      border: 1px solid; background: none; transition: background .15s, color .15s;
    }
    .btn-action.cancelar { color: var(--yellow); border-color: rgba(243,156,18,.4); }
    .btn-action.cancelar:hover { background: rgba(243,156,18,.12); }
    .btn-action.apagar   { color: var(--red);    border-color: rgba(231,76,60,.4); }
    .btn-action.apagar:hover   { background: rgba(231,76,60,.12); }
    .btn-action:disabled { opacity: .4; cursor: not-allowed; }
    .td-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

    /* ── MODAL DE CONFIRMAÇÃO ── */
    .confirm-overlay {
      display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,.75); backdrop-filter: blur(4px);
      align-items: center; justify-content: center;
    }
    .confirm-overlay.open { display: flex; }
    .confirm-box {
      background: var(--card); border: 1px solid var(--border); border-radius: 4px;
      padding: 32px 28px; max-width: 380px; width: 90%; text-align: center;
    }
    .confirm-box-icon { font-size: 36px; margin-bottom: 12px; }
    .confirm-box-title {
      font-family: 'Bebas Neue', sans-serif; font-size: 26px; color: var(--white);
      letter-spacing: 3px; margin-bottom: 8px;
    }
    .confirm-box-sub {
      font-family: 'Barlow Condensed', sans-serif; font-size: 13px; color: var(--muted);
      letter-spacing: .5px; line-height: 1.6; margin-bottom: 24px;
    }
    .confirm-box-actions { display: flex; gap: 10px; justify-content: center; }
    .confirm-box-actions button {
      font-family: 'Barlow Condensed', sans-serif; font-size: 13px; letter-spacing: 2px;
      text-transform: uppercase; padding: 10px 20px; border-radius: 2px; cursor: pointer;
      border: 1px solid; background: none; transition: background .15s;
    }
    .confirm-box-btn-cancel { color: var(--muted); border-color: var(--border); }
    .confirm-box-btn-cancel:hover { color: var(--white); border-color: var(--muted); }
    .confirm-box-btn-ok.red  { color: var(--red);    border-color: rgba(231,76,60,.5); }
    .confirm-box-btn-ok.red:hover  { background: rgba(231,76,60,.15); }
    .confirm-box-btn-ok.yellow { color: var(--yellow); border-color: rgba(243,156,18,.5); }
    .confirm-box-btn-ok.yellow:hover { background: rgba(243,156,18,.12); }

    /* ── TOGGLE MÊS / DIA ── */
    .view-toggle {
      display: flex; background: var(--card); border: 1px solid var(--border);
      border-radius: 2px; overflow: hidden; flex-shrink: 0;
    }
    .view-toggle-btn {
      font-family: 'Barlow Condensed', sans-serif; font-size: 12px; letter-spacing: 2px;
      text-transform: uppercase; padding: 7px 16px; cursor: pointer;
      background: none; border: none; color: var(--muted); transition: color .2s, background .2s;
    }
    .view-toggle-btn.active { background: var(--border); color: var(--white); }
    .view-toggle-btn:not(.active):hover { color: var(--white); }

    /* ── PERÍODO NAV (mês e dia usam o mesmo estilo) ── */
    .period-nav { display: flex; align-items: center; gap: 12px; }
    .period-btn {
      background: none; border: 1px solid var(--border); color: var(--muted);
      width: 32px; height: 32px; border-radius: 2px; cursor: pointer; font-size: 14px;
      display: flex; align-items: center; justify-content: center; transition: color .2s, border-color .2s;
    }
    .period-btn:hover { color: var(--white); border-color: var(--orange-dim); }
    .period-label { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: var(--white); letter-spacing: 2px; min-width: 180px; text-align: center; }
    .btn-hoje {
      font-family: 'Barlow Condensed', sans-serif; font-size: 11px; letter-spacing: 2px;
      text-transform: uppercase; background: none; border: 1px solid var(--border);
      color: var(--muted); padding: 5px 12px; border-radius: 2px; cursor: pointer;
      transition: color .2s, border-color .2s; white-space: nowrap;
    }
    .btn-hoje:hover { color: var(--white); border-color: var(--orange-dim); }

    /* ── MÊS NAV (alias para compatibilidade) ── */
    .month-nav { display: flex; align-items: center; gap: 12px; }
    .month-btn {
      background: none; border: 1px solid var(--border); color: var(--muted);
      width: 32px; height: 32px; border-radius: 2px; cursor: pointer; font-size: 14px;
      display: flex; align-items: center; justify-content: center; transition: color .2s, border-color .2s;
    }
    .month-btn:hover { color: var(--white); border-color: var(--orange-dim); }
    .month-label { font-family: 'Bebas Neue', sans-serif; font-size: 20px; color: var(--white); letter-spacing: 2px; min-width: 160px; text-align: center; }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) {
      .dash-stats { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 600px) {
      #dashContent { padding: 16px; }

      /* Header */
      .dash-title { font-size: 32px; letter-spacing: 2px; }

      /* Filtros: empilha verticalmente */
      .dash-filters { gap: 8px; }
      .filter-select { width: 100%; font-size: 14px; padding: 10px 12px; }
      .month-label { font-size: 17px; min-width: 130px; }

      /* Stats: 2x2 */
      .dash-stats { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .stat-card { padding: 14px 16px; }
      .stat-card .stat-n { font-size: 30px; }
      .stat-card .stat-l { font-size: 10px; }

      /* Tabela: vira cards */
      thead { display: none; }
      tbody tr {
        display: block;
        padding: 14px 16px;
        border-bottom: 1px solid var(--border);
        position: relative;
      }
      tbody td {
        display: flex;
        align-items: baseline;
        gap: 6px;
        padding: 3px 0;
        border: none;
        font-size: 13px;
      }
      tbody td::before {
        content: attr(data-label);
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        min-width: 68px;
        flex-shrink: 0;
      }
      .td-name { font-size: 15px; margin-bottom: 4px; }
      .td-name::before { display: none; }

      /* status badge no canto superior direito no card */
      td[data-label="Status"] {
        position: absolute;
        top: 14px; right: 14px;
        padding: 0;
      }
      td[data-label="Status"]::before { display: none; }
    }
  </style>
</head>
<body>

  <!-- CURTAIN para transição de página -->
  <div id="curtain">
    <div class="curtain-half curtain-top"></div>
    <div class="curtain-half curtain-bottom"></div>
    <div class="curtain-mark">
      <span class="curtain-mark-text">Navalha<span>City</span></span>
      <span class="curtain-mark-line"></span>
    </div>
  </div>

  <script src="/src/page-transition.js"></script>

  <nav class="dash-nav">
    <a href="/" class="dash-logo">Navalha<span>City</span></a>
    <div class="nav-links">
      <a href="/dashboard" class="nav-link active">Dashboard</a>
      <a href="/equipe" class="nav-link" id="btnEquipe" style="display:none">Equipe</a>
    </div>
    <div class="dash-nav-right">
      <span class="dash-user-name" id="navUserName"></span>
      <span class="dash-role-badge" id="navRoleBadge"></span>
      <button class="btn-logout" onclick="dashLogout()">Sair</button>
      <button class="dash-hamburger" id="dashHamburger" onclick="toggleDashMenu()">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- MENU MOBILE DO DASHBOARD -->
  <div class="dash-mobile-menu" id="dashMobileMenu">
    <button class="dash-mobile-close" onclick="toggleDashMenu()">&#x2715;</button>
    <a href="/dashboard" class="dash-mobile-link active">Dashboard</a>
    <a href="/equipe" class="dash-mobile-link" id="mobileEquipeLink" style="display:none">Equipe</a>
    <div class="dash-mobile-user" id="dashMobileUser"></div>
  </div>

  <div id="loadingScreen">Carregando...</div>

  <!-- MODAL DE CONFIRMAÇÃO DE AÇÃO -->
  <div class="confirm-overlay" id="actionModal">
    <div class="confirm-box">
      <div class="confirm-box-icon" id="actionModalIcon"></div>
      <div class="confirm-box-title" id="actionModalTitle"></div>
      <div class="confirm-box-sub" id="actionModalSub"></div>
      <div class="confirm-box-actions">
        <button class="confirm-box-btn-cancel" onclick="closeActionModal()">Cancelar</button>
        <button class="confirm-box-btn-ok" id="actionModalBtn" onclick="executeAction()">Confirmar</button>
      </div>
    </div>
  </div>

  <div id="accessDenied">
    <div class="icon">🔒</div>
    <h2>Acesso Restrito</h2>
    <p>Você não tem permissão para acessar esta área.</p>
    <a href="/" style="color:var(--muted);font-size:13px;margin-top:8px">← Voltar ao site</a>
  </div>

  <div id="dashContent">
    <div class="dash-header">
      <div class="dash-title" id="dashTitle">Dashboard</div>
      <div class="dash-subtitle" id="dashSubtitle"></div>
      <div class="dash-welcome-mobile" id="dashWelcomeMobile"></div>
    </div>

    <div class="dash-filters">
      <!-- Toggle modo -->
      <div class="view-toggle">
        <button class="view-toggle-btn active" id="btnModeMes" onclick="setMode('mes')">Mês</button>
        <button class="view-toggle-btn" id="btnModeDia" onclick="setMode('dia')">Dia</button>
      </div>

      <!-- Navegação de período -->
      <div class="period-nav">
        <button class="period-btn" onclick="changePeriod(-1)">‹</button>
        <div class="period-label" id="periodLabel"></div>
        <button class="period-btn" onclick="changePeriod(1)">›</button>
      </div>
      <button class="btn-hoje" id="btnHoje" style="display:none" onclick="goToToday()">Hoje</button>

      <select class="filter-select" id="filterFilial" onchange="loadDash()" style="display:none">
        <option value="">Todas as unidades</option>
      </select>
      <select class="filter-select" id="filterStatus" onchange="loadDash()">
        <option value="">Todos os status</option>
        <option value="confirmado">Confirmado</option>
        <option value="pendente">Pendente</option>
        <option value="cancelado">Cancelado</option>
      </select>
    </div>

    <div class="dash-stats" id="dashStats"></div>

    <div class="dash-table-wrap">
      <div class="dash-table-header">
        <span class="dash-table-title">Agendamentos</span>
        <span class="dash-count" id="dashCount">0</span>
      </div>
      <table>
        <thead>
          <tr>
            <th>Data / Hora</th>
            <th>Cliente</th>
            <th>Serviço</th>
            <th>Barbeiro</th>
            <th>Unidade</th>
            <th>Status</th>
            <th>Valor</th>
            <th id="thAcoes" style="display:none">Ações</th>
          </tr>
        </thead>
        <tbody id="dashTableBody"></tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

    const SUPABASE_URL  = 'https://lttajvnvbnmyowvwrunw.supabase.co'
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx0dGFqdm52Ym5teW93dndydW53Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxNTk1MTQsImV4cCI6MjA5MzczNTUxNH0.oG8iO96DftAmb1hLuGSNscyG2647TbncbeuN98clKus'
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON)

    const ROLES_PERMITIDOS = ['admin', 'gerente', 'barbeiro']
    const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro']
    const FILIAIS = { 1:'Unidade 1', 2:'Unidade 2', 3:'Unidade 3', 4:'Unidade 4', 5:'Unidade 5' }

    let currentUser    = null
    let currentProfile = null
    let viewMode  = 'mes'
    let viewMonth = new Date().getMonth()
    let viewYear  = new Date().getFullYear()
    let viewDay   = new Date().getDate()

    async function init() {
      const { data: { session } } = await supabase.auth.getSession()
      if (!session) { showDenied(); return }

      const { data: profile } = await supabase
        .from('profiles')
        .select('nome, role, filial_id')
        .eq('id', session.user.id)
        .single()

      if (!profile || !ROLES_PERMITIDOS.includes(profile.role)) { showDenied(); return }

      currentUser    = session.user
      currentProfile = profile

      // Nav desktop
      // Botão Equipe — só admin
      if (profile.role === 'admin') {
        document.getElementById('btnEquipe').style.display = ''
        document.getElementById('mobileEquipeLink').style.display = ''
      }

      document.getElementById('navUserName').textContent = profile.nome.split(' ')[0]
      const badge = document.getElementById('navRoleBadge')
      badge.textContent = profile.role
      badge.className   = `dash-role-badge ${profile.role}`

      // Menu mobile: nome + role + botão sair
      document.getElementById('dashMobileUser').innerHTML = `
        <div style="color:var(--white);font-size:15px;margin-bottom:4px">${profile.nome.split(' ')[0]}</div>
        <div style="margin-bottom:16px">${profile.role}</div>
        <button onclick="dashLogout()" style="background:none;border:1px solid var(--border);color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:2px;text-transform:uppercase;padding:8px 16px;border-radius:2px;cursor:pointer">Sair da conta</button>
      `

      // Título
      document.getElementById('dashTitle').textContent =
        profile.role === 'admin'   ? 'Dashboard' :
        profile.role === 'gerente' ? 'Dashboard' : 'Minha Agenda'

      document.getElementById('dashSubtitle').textContent =
        profile.role === 'admin'   ? 'Visão completa de todas as unidades' :
        profile.role === 'gerente' ? `${FILIAIS[profile.filial_id] || 'Sua unidade'}` :
                                     `Seus agendamentos · ${profile.nome}`

      // Boas-vindas mobile (abaixo do título)
      document.getElementById('dashWelcomeMobile').textContent =
        `Olá, ${profile.nome.split(' ')[0]} · ${profile.role}`

      // Filtro de filial só pra admin
      if (profile.role === 'admin') {
        const sel = document.getElementById('filterFilial')
        sel.style.display = 'block'
        Object.entries(FILIAIS).forEach(([id, nome]) => {
          const opt = document.createElement('option')
          opt.value = id; opt.textContent = nome
          sel.appendChild(opt)
        })
      }

      updatePeriodLabel()
      document.getElementById('loadingScreen').style.display = 'none'
      document.getElementById('dashContent').style.display   = 'block'
      await loadDash()
    }

    function showDenied() {
      document.getElementById('loadingScreen').style.display = 'none'
      document.getElementById('accessDenied').style.display  = 'flex'
    }

    const DIAS_SEMANA = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb']

    function updatePeriodLabel() {
      const el = document.getElementById('periodLabel')
      if (viewMode === 'mes') {
        el.textContent = `${MESES[viewMonth]} ${viewYear}`
        el.style.minWidth = '180px'
      } else {
        const d = new Date(viewYear, viewMonth, viewDay)
        const hoje = new Date()
        const isHoje = d.toDateString() === hoje.toDateString()
        const diaSem = DIAS_SEMANA[d.getDay()]
        el.textContent = `${diaSem}  ${String(viewDay).padStart(2,'0')}/${String(viewMonth+1).padStart(2,'0')}`
        el.style.minWidth = '160px'
        document.getElementById('btnHoje').style.display = isHoje ? 'none' : ''
      }
    }

    window.setMode = (mode) => {
      viewMode = mode
      document.getElementById('btnModeMes').classList.toggle('active', mode === 'mes')
      document.getElementById('btnModeDia').classList.toggle('active', mode === 'dia')
      // ao entrar no modo dia, posiciona no dia atual do mês visualizado
      if (mode === 'dia') {
        const hoje = new Date()
        if (viewMonth === hoje.getMonth() && viewYear === hoje.getFullYear()) {
          viewDay = hoje.getDate()
        } else {
          viewDay = 1
        }
        document.getElementById('btnHoje').style.display = ''
      } else {
        document.getElementById('btnHoje').style.display = 'none'
      }
      updatePeriodLabel()
      loadDash()
    }

    window.changePeriod = (dir) => {
      if (viewMode === 'mes') {
        viewMonth += dir
        if (viewMonth > 11) { viewMonth = 0;  viewYear++ }
        if (viewMonth < 0)  { viewMonth = 11; viewYear-- }
      } else {
        const d = new Date(viewYear, viewMonth, viewDay + dir)
        viewYear  = d.getFullYear()
        viewMonth = d.getMonth()
        viewDay   = d.getDate()
      }
      updatePeriodLabel()
      loadDash()
    }

    window.goToToday = () => {
      const hoje = new Date()
      viewYear  = hoje.getFullYear()
      viewMonth = hoje.getMonth()
      viewDay   = hoje.getDate()
      updatePeriodLabel()
      loadDash()
    }

    // manter compatibilidade com qualquer referência antiga
    window.changeMonth = (dir) => window.changePeriod(dir)

    window.toggleDashMenu = () => {
      const menu = document.getElementById('dashMobileMenu')
      const btn  = document.getElementById('dashHamburger')
      const open = menu.classList.toggle('open')
      btn.classList.toggle('open', open)
      document.body.style.overflow = open ? 'hidden' : ''
    }

    window.loadDash = async () => {
      const tbody = document.getElementById('dashTableBody')
      const stats = document.getElementById('dashStats')
      tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:24px;font-family:'Barlow Condensed',sans-serif;letter-spacing:1px">Carregando...</td></tr>`
      stats.innerHTML = ''

      const inicio = viewMode === 'mes'
        ? new Date(viewYear, viewMonth, 1).toISOString()
        : new Date(viewYear, viewMonth, viewDay, 0, 0, 0).toISOString()
      const fim = viewMode === 'mes'
        ? new Date(viewYear, viewMonth + 1, 0, 23, 59, 59).toISOString()
        : new Date(viewYear, viewMonth, viewDay, 23, 59, 59).toISOString()

      let query = supabase
        .from('agendamentos')
        .select('id, horario, servico, barbeiro, preco, status, filial_id, observacoes, cliente_nome, cliente_tel')
        .gte('horario', inicio)
        .lte('horario', fim)
        .order('horario', { ascending: true })

      if (currentProfile.role === 'gerente') {
        query = query.eq('filial_id', currentProfile.filial_id)
      } else if (currentProfile.role === 'barbeiro') {
        query = query.eq('barbeiro', currentProfile.nome)
      } else {
        const filialSel = document.getElementById('filterFilial').value
        if (filialSel) query = query.eq('filial_id', parseInt(filialSel))
      }

      const statusSel = document.getElementById('filterStatus').value
      if (statusSel) query = query.eq('status', statusSel)

      const { data, error } = await query

      if (error) {
        tbody.innerHTML = `<tr class="empty-row"><td colspan="7">Erro ao carregar dados.</td></tr>`
        return
      }

      const total       = data.length
      const confirmados = data.filter(r => r.status === 'confirmado').length
      const pendentes   = data.filter(r => r.status === 'pendente').length
      const receita     = data
        .filter(r => r.status === 'confirmado')
        .reduce((sum, r) => sum + (parseFloat(r.preco?.replace(/[^\d,]/g,'').replace(',','.')) || 0), 0)

      const lblTotal = viewMode === 'mes' ? 'Total do m\u00eas' : 'Total do dia'
      stats.innerHTML = `
        <div class="stat-card"><div class="stat-n">${total}</div><div class="stat-l">${lblTotal}</div></div>
        <div class="stat-card green"><div class="stat-n">${confirmados}</div><div class="stat-l">Confirmados</div></div>
        <div class="stat-card yellow"><div class="stat-n">${pendentes}</div><div class="stat-l">Pendentes</div></div>
        <div class="stat-card"><div class="stat-n">R$\u00a0${receita.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,'.')}</div><div class="stat-l">Receita confirmada</div></div>
      `
      document.getElementById('dashCount').textContent = total

      // Mostra coluna de ações para admin e gerente
      const canEdit = ['admin', 'gerente'].includes(currentProfile.role)
      document.getElementById('thAcoes').style.display = canEdit ? '' : 'none'

      if (!data.length) {
        tbody.innerHTML = `<tr class="empty-row"><td colspan="${canEdit ? 8 : 7}">Nenhum agendamento neste período.</td></tr>`
        return
      }

      tbody.innerHTML = data.map(row => {
        const d        = new Date(row.horario)
        const data_fmt = `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`
        const hora_fmt = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`
        const cliente  = row.cliente_nome || '—'
        const tel      = row.cliente_tel  || ''
        const filial   = FILIAIS[row.filial_id] || `Unidade ${row.filial_id}`
        const badgeCls = `td-badge badge-${row.status}`
        const isCancelado = row.status === 'cancelado'

        const acoesTd = canEdit ? `
          <td data-label="Ações">
            <div class="td-actions">
              <button
                class="btn-action cancelar"
                onclick="promptAcao('cancelar', '${row.id}', '${esc(cliente)}')"
                ${isCancelado ? 'disabled title="Já cancelado"' : ''}>
                Cancelar
              </button>
              <button
                class="btn-action apagar"
                onclick="promptAcao('apagar', '${row.id}', '${esc(cliente)}')">
                Apagar
              </button>
            </div>
          </td>` : ''

        return `
          <tr id="row-${row.id}">
            <td data-label="Data"><b>${data_fmt}</b> ${hora_fmt}</td>
            <td data-label="Cliente" class="td-name">${esc(cliente)}${tel ? `<br><span style="color:var(--muted);font-size:11px;font-weight:400">${esc(tel)}</span>` : ''}</td>
            <td data-label="Serviço">${esc(row.servico)}</td>
            <td data-label="Barbeiro">${esc(row.barbeiro)}</td>
            <td data-label="Unidade">${esc(filial)}</td>
            <td data-label="Status"><span class="${badgeCls}" id="status-${row.id}">${row.status}</span></td>
            <td data-label="Valor">${esc(row.preco)}</td>
            ${acoesTd}
          </tr>
        `
      }).join('')
    }

    function esc(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    }

    // ── AÇÕES: cancelar / apagar ─────────────────────────────
    let _pendingAction = null

    window.promptAcao = (tipo, id, clienteNome) => {
      _pendingAction = { tipo, id }
      const modal = document.getElementById('actionModal')
      const icon  = document.getElementById('actionModalIcon')
      const title = document.getElementById('actionModalTitle')
      const sub   = document.getElementById('actionModalSub')
      const btn   = document.getElementById('actionModalBtn')

      if (tipo === 'cancelar') {
        icon.textContent  = '⚠️'
        title.textContent = 'Cancelar agendamento'
        sub.textContent   = `Marcar o agendamento de ${clienteNome} como cancelado? O horário será liberado.`
        btn.textContent   = 'Sim, cancelar'
        btn.className     = 'confirm-box-btn-ok yellow'
      } else {
        icon.textContent  = '🗑️'
        title.textContent = 'Apagar agendamento'
        sub.textContent   = `Apagar definitivamente o agendamento de ${clienteNome}? Esta ação não pode ser desfeita.`
        btn.textContent   = 'Sim, apagar'
        btn.className     = 'confirm-box-btn-ok red'
      }
      modal.classList.add('open')
    }

    window.closeActionModal = () => {
      document.getElementById('actionModal').classList.remove('open')
      _pendingAction = null
    }

    window.executeAction = async () => {
      if (!_pendingAction) return
      const { tipo, id } = _pendingAction
      const btn = document.getElementById('actionModalBtn')
      btn.textContent = 'Aguarde...'
      btn.disabled    = true

      try {
        if (tipo === 'cancelar') {
          const { error } = await supabase
            .from('agendamentos')
            .update({ status: 'cancelado' })
            .eq('id', id)
          if (error) throw error

          // Atualiza a linha na tela sem recarregar tudo
          const badge = document.getElementById(`status-${id}`)
          if (badge) {
            badge.textContent = 'cancelado'
            badge.className   = 'td-badge badge-cancelado'
          }
          // Desabilita o botão cancelar da linha
          const row = document.getElementById(`row-${id}`)
          if (row) {
            const btnCanc = row.querySelector('.btn-action.cancelar')
            if (btnCanc) { btnCanc.disabled = true; btnCanc.title = 'Já cancelado' }
          }
          // Atualiza stats
          await loadDash()

        } else {
          const { error } = await supabase
            .from('agendamentos')
            .delete()
            .eq('id', id)
          if (error) throw error

          // Remove a linha da tabela
          const row = document.getElementById(`row-${id}`)
          if (row) row.remove()
          // Atualiza stats
          await loadDash()
        }

        closeActionModal()
      } catch (err) {
        btn.textContent = 'Erro — tente novamente'
        btn.disabled    = false
        console.error(err)
      }
    }

    // Fecha o modal ao clicar fora
    document.getElementById('actionModal').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeActionModal()
    })

    window.dashLogout = async () => {
      await supabase.auth.signOut()
      if (window.pageTransitionTo) window.pageTransitionTo('/')
      else window.location.href = '/'
    }

    init()
  </script>
</body>
</html>
