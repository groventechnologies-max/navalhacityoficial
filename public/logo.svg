<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Anel externo -->
  <circle cx="50" cy="50" r="46" stroke="white" stroke-width="1.8"/>
  <!-- Anel interno decorativo -->
  <circle cx="50" cy="50" r="39" stroke="white" stroke-width="0.6" stroke-dasharray="3 5" stroke-opacity="0.4"/>

  <!-- Tesoura — lâminas cruzando em (50,50) -->
  <!-- Lâmina superior: argola superior-esq até ponta inferior-dir -->
  <line x1="31" y1="34" x2="74" y2="68" stroke="white" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Lâmina inferior: argola inferior-esq até ponta superior-dir -->
  <line x1="31" y1="66" x2="74" y2="32" stroke="white" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Argolas (cabo) -->
  <circle cx="25" cy="30" r="8" stroke="white" stroke-width="2.2"/>
  <circle cx="25" cy="70" r="8" stroke="white" stroke-width="2.2"/>

  <!-- Ponto de pivô -->
  <circle cx="52" cy="50" r="3" fill="white"/>

  <!-- Detalhes mini nas pontas das lâminas -->
  <circle cx="76" cy="31" r="1.4" fill="white" opacity="0.6"/>
  <circle cx="76" cy="69" r="1.4" fill="white" opacity="0.6"/>
</svg>
